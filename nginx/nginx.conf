# Docker embedded DNS — defer upstream lookup so nginx can start before all containers exist.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name zaforiq.me www.zaforiq.me;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zaforiq.me www.zaforiq.me;

    ssl_certificate /etc/letsencrypt/live/zaforiq.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaforiq.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    location /media/ {
        set $upstream_minio minio:9000;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://$upstream_minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_frontend frontend:5173;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        set $upstream_backend backend:3000;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name files.zaforiq.me;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name files.zaforiq.me;

    ssl_certificate /etc/letsencrypt/live/files.zaforiq.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.zaforiq.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    location /api {
        set $upstream_fileshare_api fileshare-api:4000;
        proxy_pass http://$upstream_fileshare_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_fileshare_web fileshare-web:3000;
        proxy_pass http://$upstream_fileshare_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}