services:
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio_user} -d ${POSTGRES_DB:-portfolio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  minio:
    image: alpine/minio:latest-release
    container_name: portfolio-minio
    restart: always
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - default

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/zafor4/portfolio-backend:latest}
    container_name: portfolio-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-portfolio_user}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-portfolio_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
      PORT: 3000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: portfolio-assets
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/media}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - default

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/zafor4/portfolio-frontend:latest}
    container_name: portfolio-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - default

  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - default

networks:
  default:
    name: portfolio_default

volumes:
  postgres_data:
  minio_data:








